name: Sync upstream and build custom apps

on:
  push:
    branches:
      - master
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream master
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      release_version: ${{ steps.sync.outputs.release_version }}
      upstream_release_tag: ${{ steps.sync.outputs.upstream_release_tag }}
      upstream_commit: ${{ steps.sync.outputs.upstream_commit }}
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream updates
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wgh136/pixes.git
          git fetch upstream master

          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/master
          after="$(git rev-parse HEAD)"
          upstream_commit="$(git rev-parse upstream/master)"

          upstream_release_tag="$(gh api repos/wgh136/pixes/releases/latest --jq .tag_name || true)"
          if [ -z "$upstream_release_tag" ]; then
            upstream_release_tag="v$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          upstream_version="${upstream_release_tag#v}"
          release_version="${upstream_version}-fork.${GITHUB_RUN_NUMBER}"
          release_tag="v${release_version}"

          echo "commit_sha=$after" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"

          if [ "$before" != "$after" ]; then
            git push origin HEAD:master
          fi

          latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0] // {} | [.tag_name // "", .target_commitish // ""] | @tsv')"
          read -r existing_tag existing_commit <<< "$latest_release"
          if [[ "$existing_commit" == "$after" && "$existing_tag" == "v${upstream_version}-fork."* ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Build Android APKs
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated fork master
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.commit_sha }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install signing key from secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE repository secret (base64 .jks) plus either ANDROID_KEY_PROPERTIES or ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Without a fixed key every build gets a random signature and cannot update the installed app."
            exit 1
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            # Same layout as upstream's main.yml, so its secrets work unchanged.
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_PROPERTIES is not set, so ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build release APKs
        shell: bash
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: pixes-custom-Android-${{ github.run_number }}
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout updated fork master
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.commit_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Select latest available Xcode
        shell: bash
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting Xcode at: $XCODE"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      - name: Build unsigned IPA
        shell: bash
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r9 pixes-custom-ios-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: pixes-custom-iOS-${{ github.run_number }}
          path: pixes-custom-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish custom release
    needs: [sync, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish fork release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.sync.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.sync.outputs.release_version }}
          UPSTREAM_RELEASE_TAG: ${{ needs.sync.outputs.upstream_release_tag }}
          UPSTREAM_COMMIT: ${{ needs.sync.outputs.upstream_commit }}
        run: |
          gh api "repos/wgh136/pixes/releases/tags/$UPSTREAM_RELEASE_TAG" --jq '.body // ""' > "$RUNNER_TEMP/upstream-release-notes.md" || : > "$RUNNER_TEMP/upstream-release-notes.md"
          {
            echo "Personal pixes fork build $RELEASE_VERSION, based on upstream release $UPSTREAM_RELEASE_TAG."
            echo
            echo "Upstream: https://github.com/wgh136/pixes/commit/$UPSTREAM_COMMIT"
            echo "Upstream release: https://github.com/wgh136/pixes/releases/tag/$UPSTREAM_RELEASE_TAG"
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
            echo
            echo "Upstream release notes ($UPSTREAM_RELEASE_TAG):"
            echo
            cat "$RUNNER_TEMP/upstream-release-notes.md"
            echo
            echo "Android APK and unsigned iOS IPA builds passed."
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "pixes $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
